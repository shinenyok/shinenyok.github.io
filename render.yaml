services:
  - type: web
    name: shineyoki-music-proxy
    runtime: node
    plan: free
    rootDir: services/music-proxy
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://www.shineyoki.top,https://shineyoki.top
      - key: ALLOWED_HOSTS
        value: search.kuwo.cn,songsearch.kugou.com,lxmusicapi.onrender.com
      - key: UPSTREAM_TIMEOUT_MS
        value: "13000"
      - key: PROXY_TOKEN
        sync: false
